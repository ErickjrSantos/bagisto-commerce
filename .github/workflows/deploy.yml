name: Deploy to VPS

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}"

      - name: Deploy code to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Pull latest code
            if [ -d .git ]; then
              echo "Updating existing repository..."
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              echo "Cloning repository..."
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
            fi
            
            echo "✅ Code deployment completed"
          EOF

      - name: Create/Update .env file on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            cat > .env << 'ENVEOF'
          # Application
          APP_NAME=${{ secrets.APP_NAME }}
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_DEBUG_ALLOWED_IPS=
          APP_URL=${{ secrets.APP_URL }}
          APP_ADMIN_URL=admin
          APP_TIMEZONE=Africa/Kampala
          
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          APP_CURRENCY=USD
          
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=12
          
          # Logging
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error
          
          # Database
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PREFIX=
          
          # Session & Cache
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=public
          QUEUE_CONNECTION=sync
          
          CACHE_STORE=file
          CACHE_PREFIX=
          
          MEMCACHED_HOST=127.0.0.1
          
          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          
          RESPONSE_CACHE_ENABLED=true
          
          # Mail (Optional - configure later if needed)
          MAIL_MAILER=log
          MAIL_HOST=
          MAIL_PORT=
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_ENCRYPTION=
          
          MAIL_FROM_ADDRESS=
          MAIL_FROM_NAME=
          
          ADMIN_MAIL_ADDRESS=
          ADMIN_MAIL_NAME=
          
          CONTACT_MAIL_ADDRESS=
          CONTACT_MAIL_NAME=
          
          # AWS (Optional)
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET=${{ secrets.AWS_BUCKET }}
          AWS_USE_PATH_STYLE_ENDPOINT=false
          
          # Vite
          VITE_APP_NAME="${{ secrets.APP_NAME }}"
          VITE_HOST=localhost
          VITE_PORT=
          ENVEOF
          EOF

      - name: Install Composer dependencies
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Install dependencies
            composer install --optimize-autoloader --no-dev --no-interaction
            
            echo "✅ Composer dependencies installed"
          EOF

      - name: Run database migrations
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Run migrations
            php artisan migrate --force
            
            echo "✅ Database migrations completed"
          EOF

      - name: Setup storage and optimize
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Create storage link
            php artisan storage:link || true
            
            # Set proper permissions
            chmod -R 775 storage bootstrap/cache
            chown -R $USER:www-data storage bootstrap/cache
            
            # Clear all caches
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            
            # Cache for production
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            
            echo "✅ Application optimized for production"
          EOF

      - name: Install and build frontend assets
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Install npm dependencies
            npm ci --production
            
            # Build assets
            npm run build
            
            echo "✅ Frontend assets built"
          EOF

      - name: Restart PHP-FPM and web server
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Restart PHP-FPM
            sudo systemctl restart php8.2-fpm
            
            # Restart Nginx/Apache
            sudo systemctl restart nginx || sudo systemctl restart apache2
            
            echo "✅ Services restarted"
          EOF

      - name: Health Check
        run: |
          sleep 5
          echo "Checking application health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }} || echo "000")
          echo "Got HTTP status: $STATUS"
          
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Site is responding (HTTP $STATUS)"
          else
            echo "⚠️  Site returned HTTP $STATUS - Check manually at ${{ secrets.APP_URL }}"
          fi

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to ${{ secrets.APP_URL }} completed successfully!"
            echo "🎉 Your Bagisto store is now live!"
          else
            echo "❌ Deployment failed!"
            echo "Check the logs above for details."
          fi
