name: Deploy to VPS with Docker

on:
  push:
    branches:
      - 2.3
      - main
      - production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.lowercase.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set lowercase image tag
        id: lowercase
        run: |
          IMAGE_TAG=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image will be tagged as: ${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.lowercase.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}"

      - name: Copy docker-compose to VPS
        run: |
          set -e
          echo "Copying docker-compose.prod.yml..."
          scp -v docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml
          echo "Copying docker directory..."
          scp -v -r docker ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/
          echo "Verifying files on VPS..."
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -la ${{ secrets.DEPLOY_PATH }}"

      - name: Create .env file on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            cat > .env << 'ENVEOF'
          # Application
          APP_NAME=${{ secrets.APP_NAME }}
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_ADMIN_URL=admin
          APP_TIMEZONE=Africa/Kampala
          
          # Database
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=root
          DB_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          
          # Cache & Session
          CACHE_STORE=redis
          CACHE_PREFIX=bagisto_
          SESSION_DRIVER=redis
          SESSION_LIFETIME=120
          REDIS_HOST=redis
          REDIS_PORT=6379
          
          # Queue
          QUEUE_CONNECTION=redis
          
          # Mail (commented out - add secrets later if needed)
          # MAIL_MAILER=smtp
          # MAIL_HOST=${{ secrets.MAIL_HOST }}
          # MAIL_PORT=${{ secrets.MAIL_PORT }}
          # MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          # MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          # MAIL_ENCRYPTION=tls
          # MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          # ADMIN_MAIL_ADDRESS=${{ secrets.ADMIN_MAIL_ADDRESS }}
          
          # Docker
          DOCKER_IMAGE=${{ needs.build-and-push.outputs.image_tag }}
          NGINX_PORT=8080
          NGINX_SSL_PORT=8443
          PHP_MEMORY_LIMIT=512M
          
          # Response Cache
          RESPONSE_CACHE_ENABLED=true
          
          # Elasticsearch
          ELASTICSEARCH_HOSTS=http://elasticsearch:9200
          ENVEOF
          EOF

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Verify files exist
            echo "Files in deployment directory:"
            ls -la
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            
            # Stop and remove old containers
            docker compose down
            
            # Start new containers
            docker compose up -d
            
            # Wait for services to be ready
            echo "Waiting for services to start..."
            sleep 45
            
            # Check container status
            echo "Container status:"
            docker compose ps
            
            # Check MySQL logs
            echo "MySQL logs:"
            docker compose logs mysql | tail -50
            
            # Wait for MySQL to be fully ready
            echo "Waiting for MySQL to initialize..."
            MAX_TRIES=30
            COUNT=0
            until docker compose exec -T mysql mysqladmin ping -h localhost --silent 2>/dev/null; do
              COUNT=$((COUNT+1))
              if [ $COUNT -ge $MAX_TRIES ]; then
                echo "MySQL failed to start after $MAX_TRIES attempts"
                docker compose logs mysql
                exit 1
              fi
              echo "MySQL is unavailable - attempt $COUNT/$MAX_TRIES"
              sleep 5
            done
            echo "MySQL is ready!"
            
            # Run migrations
            docker compose exec -T php php artisan migrate --force
            
            # Create storage link
            docker compose exec -T php php artisan storage:link || true
            
            # Clear and optimize
            docker compose exec -T php php artisan config:clear
            docker compose exec -T php php artisan cache:clear
            docker compose exec -T php php artisan route:clear
            docker compose exec -T php php artisan view:clear
            
            # Cache for production
            docker compose exec -T php php artisan config:cache
            docker compose exec -T php php artisan route:cache
            docker compose exec -T php php artisan view:cache
            docker compose exec -T php php artisan optimize
            
            # Cleanup old images
            docker image prune -f
          EOF

      - name: Health Check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }})
          if [ $STATUS -eq 200 ] || [ $STATUS -eq 302 ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to ${{ secrets.APP_URL }} completed successfully!"
          else
            echo "❌ Deployment failed!"
          fi
